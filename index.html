function addLeg(){const l=B.l,a=B.a.trim(),b=B.b.trim(),lg=B.legs,p=l&&bfs(adj[l],a,b),fail=m=>{B.msg=m;render()};if(!p||p.length<2)return fail("✗ line / stations");if(lg.length&&lg[lg.length-1].b!=a)return fail("✗ not contiguous");const e=p.slice(1).map((s,i)=>ek(l,p[i],s));if(e.some(k=>taken(k)||lg.some(x=>x.e.includes(k))))return fail("✗ already claimed");lg.push({l,a,b,e,n:e.length,c:Math.ceil(e.length/2)});B.a=b;B.b="";B.msg="";render()}

async function doClaim(){if(!B.ph){B.msg="📷";return render()}B.msg="…";render();let ph;try{ph=await up(B.ph)}catch(e){B.msg="Upload failed";return render()}const lg=B.legs.map(x=>({...x})),tot=lg.reduce((a,x)=>a+x.c,0);if(await mut(s=>{if(!live(s))return"✗ time";const t=s.teams[me],h=t.hand,use={};let w=h.W||0;if(lg.some(x=>x.e.some(k=>taken(k,s))))return"✗ already claimed";lg.forEach(x=>use[x.l]=(use[x.l]||0)+x.c);for(const l in use){const m=Math.min(use[l],h[l]||0);w-=use[l]-m;h[l]=(h[l]||0)-m}if(w<0)return"✗ not enough cards";h.W=w;t.claims.push({legs:lg,cards:tot,pts:pts(tot,lg.length),ph,t:Date.now()})})){B.legs=[];B.ph=null;render()}}
const startG=()=>mut(s=>{if(s.st!="lobby")return"✗";const n=Date.now();s.st="live";s.end=n+72e5;s.teams.forEach(t=>{for(let i=0;i<6;i++){const l=LK[Math.random()*LK.length|0];t.hand[l]=(t.hand[l]||0)+1}t.last=n-3e5;t.pend={ids:[0,1,2,3].filter(()=>s.pool.length).map(()=>rnd(s.pool)),min:2}})});

const purl=p=>`${SB_URL}/storage/v1/object/public/photos/${p}`,vBoard=()=>S.teams.flatMap(t=>t.claims.map(c=>({t:t.n,c}))).sort((a,b)=>b.c.t-a.c.t).map(({t,c})=>`<div class=c><b>${t}</b><br>${c.legs.map(x=>`${chip(x.l)} ${x.a} → ${x.b}`).join("<br>")}${ended()?`<br><a href="${purl(c.ph)}" target=_blank><img src="${purl(c.ph)}" loading=lazy></a>`:""}</div>`).join("")||"–";
