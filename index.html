async function doClaim(){if(!B.ph){B.msg="📷";return render()}B.msg="…";render();let ph;try{ph=await up(B.ph)}catch(e){B.msg="Upload failed";return render()}const lg=B.legs.map(x=>({...x})),tot=lg.reduce((a,x)=>a+x.c,0);if(await mut(s=>{if(!live(s))return"✗ time";const t=s.teams[me],h=t.hand,use={};let w=h.W||0;if(lg.some(x=>x.e.some(k=>taken(k,s))))return"✗ already claimed";lg.forEach(x=>use[x.l]=(use[x.l]||0)+x.c);for(const l in use){const m=Math.min(use[l],h[l]||0);w-=use[l]-m;h[l]=(h[l]||0)-m}if(w<0)return"✗ not enough cards";h.W=w;t.claims.push({legs:lg,cards:tot,pts:pts(tot,lg.length),ph,t:Date.now()})})){B.legs=[];B.ph=null;render()}}
const startG=()=>mut(s=>{if(s.st!="lobby")return"✗";const n=Date.now();s.st="live";s.end=n+72e5;s.teams.forEach(t=>{for(let i=0;i<6;i++){const l=LK[Math.random()*LK.length|0];t.hand[l]=(t.hand[l]||0)+1}t.last=n-3e5;t.pend={ids:[0,1,2,3].filter(()=>s.pool.length).map(()=>rnd(s.pool)),min:2}})});
const pauseG=()=>mut(s=>{if(s.st=="live"){s.left=s.end-Date.now();s.st="paused"}else if(s.st=="paused"){s.end=Date.now()+s.left;s.st="live"}}),plus=()=>mut(s=>{if(s.st=="live")s.end+=3e5;else if(s.st=="paused")s.left+=3e5}),stopG=()=>confirm("?")&&mut(s=>{s.st="ended"});
const NB=()=>({l:"",a:"",b:"",legs:[],ph:null,msg:""}),restartG=async()=>{if(confirm("?")&&await mut(s=>{s.st="lobby";s.end=0;s.left=0;s.rd=(s.rd||0)+1;s.pool=DESTS.map(d=>d.id);s.teams.forEach(t=>Object.assign(t,{hand:{},dests:[],pend:null,last:0,rer:null,claims:[]}))})){B=NB();render()}},leaveG=()=>{if(!confirm("?"))return;localStorage.removeItem("g");localStorage.removeItem("me");g="";S=null;V=-1;me=NaN;mode="";B=NB();tab="hand";fin=0;render()};
const dRow=(i,x)=>`<div class=row><label>${x} ${DESTS[i].a} → ${DESTS[i].b} <b>${DESTS[i].v}</b></label></div>`;
function vHand(t){const cd=3e5-(Date.now()-t.last),ok=cd<=0&&!t.pend&&live(S);return `<div class=c>${LK.map(l=>`<span>${chip(l,t.hand[l]||0)}${(t.hand[l]||0)>=3?`<button class=b onclick="trade('${l}')">3→★</button>`:""}</span>`).join("")}<p>★ ${tr("wild")}: <b>${t.hand.W||0}</b></p></div><div class=c><div class=row><button class=b ${ok?"":"disabled"} onclick=draw(0)>${tr("d2")}</button><button class=b ${ok&&S.pool.length?"":"disabled"} onclick=draw(1)>${tr("dd")}</button> <b id=cd></b></div></div>`+(t.rer?`<div class=c>RER: ${t.rer.join(" → ")}</div>`:`<div class=c><b>${tr("rer")}</b><div class=row><input list=st id=r1 placeholder="${tr("from")}"><input list=st id=r2 placeholder="${tr("to")}"><button class=b onclick=doRer()>OK</button></div></div>`)}
const vDest=t=>(t.pend?`<div class=c><b>${tr("keep").replace("{n}",t.pend.min)}</b>${t.pend.ids.map(i=>dRow(i,`<input type=checkbox class=k value=${i}>`)).join("")}<button class=b onclick=keep()>OK</button></div>`:"")+t.dests.map(i=>`<div class=c>${dRow(i,reach(edges(t).concat(t.rer?[t.rer]:[]),DESTS[i].a,DESTS[i].b)?"✅":"")}</div>`).join("");
const vClaim=()=>{const lg=B.legs,tot=lg.reduce((a,x)=>a+x.c,0);return `<div class=c><div class=row>${LK.map(l=>`<span style="opacity:${B.l==l?1:.4}">${chip(l)}</span>`).join("")}</div><div class=row><input list=st value="${B.a}" oninput="B.a=this.value" placeholder="${tr("from")}"><input list=st value="${B.b}" oninput="B.b=this.value" placeholder="${tr("to")}"><button class=b onclick=addLeg()>${tr("add")}</button></div></div>`+(lg.length?`<div class=c>${lg.map(x=>`<div>${chip(x.l)} ${x.a} → ${x.b} · ${x.n} ${tr("stops")} · ${x.c} ${tr("cost")}</div>`).join("")}<p><b>${tot} ${tr("cost")}</b></p><input type=file accept="image/*" capture=environment onchange="B.ph=this.files[0]"><div class=row><button class=b onclick=doClaim()>${tr("do")}</button><button class=b onclick="B.legs=[];B.a='';render()">✕</button></div></div>`:"")+`<p>${B.msg}</p>`};
const purl=p=>`${SB_URL}/storage/v1/object/public/photos/${p}`,vBoard=()=>S.teams.flatMap(t=>t.claims.map(c=>({t:t.n,c}))).sort((a,b)=>b.c.t-a.c.t).map(({t,c})=>`<div class=c><b>${t}</b><br>${c.legs.map(x=>`${chip(x.l)} ${x.a} → ${x.b}`).join("<br>")}${ended()?`<br><a href="${purl(c.ph)}" target=_blank><img src="${purl(c.ph)}" loading=lazy></a>`:""}</div>`).join("")||"–";
const vMap=()=>`<div style="overflow:auto;height:75vh"><img src=map.jpg style="width:260%;max-width:none"></div>`;
const vMaster=()=>`<div class=c><div class=row>${S.st=="lobby"?`<button class=b onclick=startG()>${tr("start")}</button>`:`<button class=b onclick=pauseG()>${tr("pause")}</button>`}<button class=b onclick=plus()>${tr("plus")}</button><button class=b onclick=stopG()>${tr("stop")}</button><button class=b onclick=restartG()>${tr("restart")}</button></div></div>`;
