s.onpointermove=e=>{if(!ps.has(e.pointerId))return;const o=ps.get(e.pointerId),n=[e.clientX,e.clientY];ps.set(e.pointerId,n);mv+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);if(ps.size==1){VB[0]-=(n[0]-o[0])*VB[2]/r.width;VB[1]-=(n[1]-o[1])*VB[3]/r.height;set()}else if(ps.size==2){const[a,b]=[...ps.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d0&&d)zoom(d0/d,xy({clientX:(a[0]+b[0])/2,clientY:(a[1]+b[1])/2}));d0=d}};
s.onpointerup=e=>{ps.delete(e.pointerId);if(mv<8&&Date.now()-st<500&&MT)MT(xy(e))};
s.onwheel=e=>{e.preventDefault();zoom(e.deltaY>0?1.2:1/1.2,xy(e))};set()}
